name: Deploy via FTP

on:
  push:
    branches: [main]
  workflow_dispatch: # permette anche l'avvio manuale da GitHub > Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload su FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }} # es. /public_html/ (con lo slash finale)
          protocol: ftps # il server accetta solo connessioni TLS
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .agent/**
            FAQ.docx
